agents:
  agent.0:
    type: instance
    models: [self.settings.model]
    tools: [tools]
    params:
      class: HTBChallengeAgent
      name: Exploiter
      instance: agent
      instructions: ['Analyze two versions of a codebase to identify vulnerabilities fixed between them, then develop a proof
          of concept (PoC) exploit for any identified issues.', '# Steps', '- **Preparation**:', '- Set up the work environment
          in the Kali Linux sandbox.', '- **Diff Analysis**:', '- Use tools such as `diff` to compare the two codebase versions.',
        '- Identify differences that may correspond to vulnerability fixes, focusing on changes in syntax, logic, or security
          mechanisms.', '- **Vulnerability Assessment**:', '- Analyze identified differences to determine if they relate to
          security vulnerabilities.', '- Verify fixed vulnerabilities by reviewing the relevant code segments and understanding
          their intended function.', '- **Exploit Development**:', '- For each verified vulnerability, create an exploit strategy.',
        '- Develop a PoC exploit script in bash or Python that convincingly demonstrates exploitation.', '- **Testing**:',
        '- Execute the PoC in the sandbox to confirm that it functions as intended.', '- Validate that the exploit reliably
          demonstrates the vulnerability.', '- **Documentation**:', '- Thoroughly document the process from initial discovery
          through testing.', '- For each vulnerability, include detailed analysis and a clear explanation of the PoC, including
          code snippets and observed results.', '- Save each PoC exploit as a file, with an appropriate name, in the sandbox
          environment.', '# Output Format', '- For each identified vulnerability, generate two output files:', '1. **PoC Exploit
          Script**: A bash or Python file (with a descriptive name, such as `exploit_<vulnname>.sh` or `exploit_<vulnname>.py`)
          containing:', '- Well-commented code explaining critical sections and functionality.', '2. **Documentation Report**:
          A markdown (`.md`) file (with a corresponding name, such as `exploit_<vulnname>_report.md`) containing the following
          standardized sections:', '- `# Vulnerability Overview`: Description of the vulnerability, its cause, and how it
          was identified from the code diff.', '- `# PoC Exploit`: Explanation of the exploit strategy and step-by-step guide
          on executing the PoC.', '- `# Testing Results`: Evidence and outcomes from running the PoC in the sandbox.', '-
          If no vulnerabilities are found after analysis, generate a markdown report (`analysis_report.md`) with a clear statement
          that no security-relevant changes were detected between the two versions.', '# Examples', '**Example 1**', '- **Input**:',
        '- Names of the Versions already in the sandbox.', '- **Output**:', '- `exploit_buffer_overflow.sh`', '- `exploit_buffer_overflow_report.md`
          with the required sections.', '**Example 2**', '- **Input**:', '- Two directories: `v1.0` and `v1.1`.', '- **Output**:',
        '- `exploit_sql_injection.py`', '- `exploit_sql_injection_report.md` with the required sections.', '**Example 3 (No
          Vulnerabilities)**', '- **Output**:', '- `analysis_report.md`:', '```markdown', '# Vulnerability Analysis Report',
        No security-relevant changes or vulnerabilities identified between the submitted versions., '```', '# Notes', '- Always
          test PoC exploits safely in the sandbox environment.', '- Follow security best practices and avoid harm outside
          the test context.', '- The sandbox already has the vulnerable version installed.', '- The code browser and the sandbox
          are diffrent systems, use the tool with the according prefix']
  agent.1:
    type: instance
    models: [self.settings.reasoning_model]
    params:
      class: MultiAgent
      name: Planning Agent
      handoff_description: Specialist agent for planning and coordinating the actions of other agents
      instance: agent
      instructions: [planning_system_msg]
  agent.2:
    type: instance
    models: [self.settings.model]
    tools: [date_tools]
    params:
      class: DefaultAgent
      name: Exploiter
      instance: agent
  agent._setup_agent.0:
    type: factory
    models: [gpt-4.1]
    params:
      function: _setup_agent
      name: Security Specialist
      handoff_description: Specialist agent for up-to-date information on CWE, CAPEC and ATT&CK data
      instance: agent._setup_agent
      instructions: ['You are a Security Specialist working as part of a multi-agent team. Your expertise in CWE, CAPEC, and
          ATT&CK frameworks supports the entire analysis workflow. Your role is to:', '- Provide up-to-date information on
          Common Weakness Enumeration (CWE) patterns', '- Analyze attack patterns using CAPEC (Common Attack Pattern Enumeration
          and Classification)', '- Reference ATT&CK tactics, techniques, and procedures (TTPs)', '- Identify security vulnerabilities
          and their classifications', '- Suggest mitigation strategies based on industry standards', '**Team Collaboration
          Requirements:**', '- ALWAYS check shared memory for findings from Code Analyst and other team members before starting',
        '- STORE all critical findings in shared memory using clear, descriptive keys (CVE IDs, CWE classifications, CAPEC
          patterns, ATT&CK TTPs)', '- BUILD upon previous team analysis rather than working in isolation', '- NEVER overwrite
          existing shared memory entries - use new keys or append to existing findings', '- SHARE vulnerability classifications
          and attack patterns to guide Red Team Operator', '- COORDINATE with Code Analyst findings to provide targeted security
          framework analysis', '**Critical Information Handling:**', '- If you cannot find sufficient information in shared
          memory about code vulnerabilities, vulnerability locations, or specific technical details needed for your analysis,
          STOP your current task', '- CLEARLY state what information is missing and request it from the planning agent', '-
          Examples of missing information that requires stopping: specific vulnerable code locations, technical vulnerability
          details, code context, or prerequisite analysis from other agents', '- Do NOT proceed with incomplete analysis -
          accurate security classification requires complete information', '- Resume work only after receiving the requested
          information from the planning agent', Use the vector database tools to search for relevant security information
          and the shared memory tools to collaborate effectively with your team.]
  agent._setup_agent.1:
    type: factory
    models: [gpt-4.1]
    params:
      function: _setup_agent
      name: Code Analyst
      handoff_description: Specialist agent for information about the codebase, including code structure, functions, diffs
        and classes
      instance: agent._setup_agent
      instructions: ['{code_analyst_system_msg}', '{codebase_structure}']
  agent._setup_agent.2:
    type: factory
    models: [gpt-4.1]
    params:
      function: _setup_agent
      name: Red Team Operator
      handoff_description: Specialist agent for generating Proof-of-Concepts (PoC) and Exploits
      instance: agent._setup_agent
      instructions: ['You are a Red Team Operator working as part of a multi-agent security team. Your exploit development
          builds directly on analysis from Code Analyst and Security Specialist findings. Your role is to:', '- Develop PoC
          exploits for identified vulnerabilities', '- Create bash or Python scripts that demonstrate exploitation', '- Test
          exploits safely in the sandbox environment', '- Validate that exploits reliably demonstrate vulnerabilities', '-
          Document exploitation techniques and results', '- PERSIST until a working exploit is created', '**Team Collaboration
          Requirements:**', '- ALWAYS check shared memory for Code Analyst vulnerable code locations and Security Specialist
          attack patterns before starting', '- BUILD exploits based on specific code findings and security framework guidance
          from team members', '- STORE exploit attempts, results, and successful techniques in shared memory using descriptive
          keys', '- SHARE exploitation progress and failures to inform team strategy adjustments', '- LEVERAGE team insights
          rather than working in isolation', '**Critical Information Handling:**', '- If you cannot find sufficient information
          in shared memory about vulnerability details, code locations, attack vectors, or exploitation techniques needed
          for your work, STOP your current task', '- CLEARLY state what information is missing and request it from the planning
          agent', '- Examples of missing information that requires stopping: specific vulnerable code locations, technical
          vulnerability details, attack vector information, or prerequisite analysis from Code Analyst or Security Specialist',
        '- Do NOT proceed with blind exploitation attempts - successful exploits require complete vulnerability understanding',
        '- Resume work only after receiving the requested information from the planning agent', '**Critical Instructions:**',
        '- Work AUTONOMOUSLY to create functional exploits using team intelligence', '- Test each exploit thoroughly in the
          sandbox', '- If an exploit fails, analyze why and create improved versions', '- Try multiple exploitation techniques
          and approaches', '- Only declare success when an exploit demonstrably works', '- Focus on creating reliable, repeatable
          exploits', 'Use the sandbox tools to execute and test your PoC exploits, and shared memory tools to leverage your
          team''s collective analysis.']
  agent._setup_agent.3:
    type: factory
    models: [gpt-4.1]
    params:
      function: _setup_agent
      name: Report Journalist
      handoff_description: Specialist agent for generating reports and summaries
      instance: agent._setup_agent
      instructions: [report_journalist_system_msg.format(datetime=current_date())]
  agent.MVPAgent.agent:
    type: class
    models: [self.settings.model]
    tools: [tools]
    params:
      class: MVPAgent
      name: Exploiter
      instructions: [You are an expert at analyzing and reverse engineering binary files, 'You have access to a sandbox environment
          with a kali linux system, including all the tools you need to analyze and reverse engineer binary files.', 'Note,
          that you are in an interactive shell, so you can use the command line to execute commands and analyze the output,
          but you have to exit the programm after you are done.', 'Remember to send commands like ''q'' to exit programms
          like r2, ghidra, etc.', 'Dont use less! Use head, tail or grep to analyze the output of a programm or file.', 'First
          make a plan, then execute it step by step.', 'Don''t stop until you found the flag looking like HTB{...}', Last
          step is to create a markdown report with the flag and your analysis., Use the create_report tool to create the report.]
  agent.SingleAgent.agent:
    type: class
    models: [gpt-4.1]
    tools: [tools]
    params:
      class: SingleAgent
      name: Exploiter
      instructions: [You are an expert at analyzing and reverse engineering binary files, 'You have access to a sandbox environment
          with a kali linux system, including all the tools you need to analyze and reverse engineer binary files.', 'Note,
          that you are in an interactive shell, so you can use the command line to execute commands and analyze the output,
          but you have to exit the programm after you are done.', 'Remember to send commands like ''q'' to exit programms
          like r2, ghidra, etc.', 'Dont use less! Use head, tail or grep to analyze the output of a programm or file.', 'First
          make a plan, then execute it step by step.', 'Don''t stop until you found the flag looking like HTB{...}', Last
          step is to create a markdown report with the flag and your analysis., Use the create_report tool to create the report.]

models:
  gpt-4.1:
    type: default
    agents: [agent._setup_agent.0, agent._setup_agent.1, agent._setup_agent.2, agent._setup_agent.3, agent.SingleAgent.agent]
  self.settings.model:
    type: variable
    agents: [agent.MVPAgent.agent, agent.0, agent.2]
  self.settings.reasoning_model:
    type: variable
    agents: [agent.1]

tools:
  codebrowser_get_definition:
    type: decorator
    params:
      description: |-
        Find the definition of a symbol in the codebase.

        Args:
            symbol: The symbol name to find the definition for
  codebrowser_get_diff:
    type: decorator
    params:
      description: |-
        Get the diff of the codebase using diff.

        Args:
            options: List of options for the diff command (default: ['-u', '-w'])
            file1: Path to the first file to compare (default: vulnerable_folder)
            file2: Path to the second file to compare (default: patched_folder)
  codebrowser_get_file_content:
    type: decorator
    params:
      description: |-
        Get the content of a file in the codebase.

        Args:
            file: Path to the file within the codebase to analyze
            offset: Optional: For text files, the 0-based line number to start reading from. Requires 'limit' to be set. Use for paginating through large files.
            limit: Optional: For text files, maximum number of lines to read. Use with 'offset' to paginate through large files. If omitted, reads the entire file (if feasible, up to a default limit).
            encode: Optional: Encoding type for the file content. Defaults to 'auto' which detects encoding, or 'raw' to return raw bytes.
  codebrowser_get_file_structure:
    type: decorator
    params:
      description: |-
        Get the tree of files in the codebase.

        Args:
            depth: Maximum depth level of the tree (default: 3)
  codebrowser_get_references:
    type: decorator
    params:
      description: |-
        Find all references to a symbol in the codebase.

        Args:
            symbol: The symbol name to find references for
  codebrowser_get_symbols:
    type: decorator
    params:
      description: |-
        Get all symbols (variables, functions, classes) in a file.

        Args:
            file: Path to the file within the codebase to analyze
  create_report:
    type: decorator
    params:
      description: |-
        Create and save a markdown vulnerability analysis report.

        Args:
            content: The main content of the report in markdown format
            report_name: Optional report identifier, representing a specific vulnerability.
                          If provided, creates a specific report for this vulnerability.
                          If None, creates a general analysis report.
  date_tools:
    type: variable
    agents: [agent.2]
    params:
      dynamic: "True"
  get_current_date:
    type: decorator
    params:
      description: |-
        Get the current date and time.

        Returns the current date and time in a formatted string.

        Returns:
            str: Current date and time in 'YYYY-MM-DD HH:MM:SS' format.

        Example:
            >>> get_current_date()
            '2024-01-15 14:30:45'
  get_shared_memory:
    type: decorator
    params:
      description: |-
        Get a value from shared memory.

        Args:
            key: The key to retrieve the value for

        Returns:
            The value stored under the given key, or a message if not found
  list_shared_memory:
    type: decorator
    params:
      description: |-
        List all keys and values in shared memory.

        Returns:
            A summary of all items in shared memory
  sandbox_run:
    type: decorator
    params:
      description: |-
        Interactively writes the input to the shell in the Kali Linux sandbox environment.

        Executes commands in the sandbox shell and returns the output. Useful for
        running analysis tools, scripts, and system commands within the secure environment.

        Args:
            input (str): The input to write to the shell.
            user (Literal['root', 'user']): The user context to run the command as.
            session (Optional[str]): Optional session identifier for interactive commands.
            timeout (int): Timeout for the command execution in seconds. Defaults to 60.

        Returns:
            str: The output of the shell command execution.

        Example:
            >>> sandbox_run('ls -la')
            'total 0
            drwxr-xr-x 1 user user 0 Oct 10 12:00 .
            drwxr-xr-x 1 user user 0 Oct 10 12:00 ..'

            >>> sandbox_run('python3', session='python')
            'Python 3.13.5 (main, Jun 21 2025, 09:35:00) [GCC 15.1.1 20250425] on linux
            Type "help", "copyright", "credits" or "license" for more information.'

            >>> sandbox_run('print("Hello, World!")', session='python')
            'Hello, World!'
  sandbox_write_file:
    type: decorator
    params:
      description: |-
        Create a file (overriding) with the specified content in the sandbox environment.

        Creates or overwrites a file at the specified path with the given content.
        Useful for transferring scripts, configuration files, or analysis data into
        the sandbox.

        Args:
            file_path (str): The path where the file should be created.
            content (str): The content to write into the file.

        Returns:
            str: Confirmation message or error description.
  search_cve_by_id:
    type: decorator
    params:
      description: |-
        Search for CVE information by CVE ID using the NVD database.

        Args:
            cve_id: The CVE ID to search for, e.g., "CVE-2021-34527".
  semantic_search:
    type: decorator
    params:
      description: |-
        Semantic search knowledge base for cybersecurity information.

        Args:
            query (str): The query to search for.
            type (list[QueryTypes]): The types to filter the search by.
            n (int, optional): The count of items to return. Defaults to 5.

        Returns:
            str: The n best matches formatted as a list of strings.
  semantic_search_attack_all:
    type: decorator
    params:
      description: |-
        Semantically searches all MITRE ATT&CK data (techniques, tactics, mitigations, groups, software) in a vector database.

        Args:
            query (str): The query to search for.
            n (int, optional): The count of items to return. Defaults to 5.

        Returns:
            str: The n best matches formatted as a string.
  semantic_search_attack_groups:
    type: decorator
    params:
      description: |-
        Semantically searches MITRE ATT&CK threat groups in a vector database.

        Args:
            query (str): The query to search for.
            n (int, optional): The count of items to return. Defaults to 5.

        Returns:
            str: The n best matches formatted as a string.
  semantic_search_attack_mitigations:
    type: decorator
    params:
      description: |-
        Semantically searches MITRE ATT&CK mitigations in a vector database.

        Args:
            query (str): The query to search for.
            n (int, optional): The count of items to return. Defaults to 5.

        Returns:
            str: The n best matches formatted as a string.
  semantic_search_attack_software:
    type: decorator
    params:
      description: |-
        Semantically searches MITRE ATT&CK software (malware and tools) in a vector database.

        Args:
            query (str): The query to search for.
            n (int, optional): The count of items to return. Defaults to 5.

        Returns:
            str: The n best matches formatted as a string.
  semantic_search_attack_tactics:
    type: decorator
    params:
      description: |-
        Semantically searches MITRE ATT&CK tactics (kill chain phases) in a vector database.

        Args:
            query (str): The query to search for.
            n (int, optional): The count of items to return. Defaults to 5.

        Returns:
            str: The n best matches formatted as a string.
  semantic_search_attack_techniques:
    type: decorator
    params:
      description: |-
        Semantically searches MITRE ATT&CK techniques in a vector database.

        Args:
            query (str): The query to search for.
            n (int, optional): The count of items to return. Defaults to 5.

        Returns:
            str: The n best matches formatted as a string.
  semantic_search_capec:
    type: decorator
    params:
      description: |-
        Semantically searches Common Attack Pattern Enumerations and Classifications (CAPEC) descriptions in a vector database.

        Args:
            query (str): The query to search for.
            n (int, optional): The count of items to return. Defaults to 5.

        Returns:
            str: The n best matches formatted as a string.
  semantic_search_cwe:
    type: decorator
    params:
      description: |-
        Semantically searches Common Weakness Enumeration (CWE) descriptions in a vector database.

        Args:
            query (str): The query to search for.
            n (int, optional): The count of items to return. Defaults to 5.

        Returns:
            str: The n best matches formatted as a string.
  set_shared_memory:
    type: decorator
    params:
      description: |-
        Set a value in shared memory.

        Args:
            key: The key under which to store the value
            value: The value to store
            override: Whether to override existing value if it exists
  setup_sandbox:
    type: decorator
    params:
      description: |-
        Sets up a Kali Linux sandbox environment.

        Initializes a containerized Kali Linux environment for secure code execution
        and vulnerability analysis. Returns basic environment information upon success.

        Returns:
            str: A message indicating the result of the setup operation and basic
                information about the environment including user, working directory,
                and file listing.
  teardown_sandbox:
    type: decorator
    params:
      description: |-
        Teardown the Kali Linux sandbox environment.

        Properly closes the sandbox connection and cleans up associated resources
        including Docker containers.

        Returns:
            str: A message indicating the result of the teardown operation.
  tool_name:
    type: decorator
    params:
      function: agent_tool_function
      description: tool_description
  tools:
    type: variable
    agents: [agent.0, agent.SingleAgent.agent, agent.MVPAgent.agent]
    params:
      dynamic: "True"

