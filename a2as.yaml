files:
  .json:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile]
      mode: w
      delete: "False"
  csv_path:
    type: variable
    actions: [write, read]
    params:
      caller: [open, csv.DictWriter]
      alias: [csvfile]
  db_path:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  directory_path:
    type: variable
    actions: [read]
    params:
      caller: [os.walk]
  file_name:
    type: variable
    actions: [read]
    params:
      caller: [os.unlink, os.path.exists]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [open, Path, os.path.isfile, os.path.basename]
      alias: [f]
  filepath:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  output_path:
    type: variable
    actions: [read]
    params:
      caller: [Path(), output_path.glob]
  path:
    type: variable
    actions: [read, write]
    params:
      caller: [os.path.dirname, open, os.path.isdir, os.path.isfile]
  rel_path:
    type: variable
    actions: [read]
    params:
      caller: [Path.relative_to()]
  reports_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  settings.codebase_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.abspath]
  settings.patched_folder:
    type: variable
    actions: [read]
    params:
      caller: [os.path.basename]
  settings.vulnerable_folder:
    type: variable
    actions: [read]
    params:
      caller: [os.path.basename]

networks:
  capec.mitre.org:
    type: api
    actions: [GET]
    urls: [/data/xml/capec_latest.xml]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [download_capec]
  cwe.mitre.org:
    type: api
    actions: [GET]
    urls: [/data/xml/cwec_latest.xml.zip]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [download_cwe]
